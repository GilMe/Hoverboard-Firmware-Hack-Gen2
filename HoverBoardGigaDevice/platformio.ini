; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Src
include_dir = Inc
; Only build the normal application by default. Bench tests are opt-in via -e.
default_envs = GD32F130C8T6

; Shared settings inherited by every environment below.
[env]
platform = ststm32
board = gd32f130c8
debug_tool = stlink
framework = spl
; globally override framework-spl for all environments.
; uses self-uploaded package with GD32F support
platform_packages = 
    maxgerhardt/framework-spl@2.10302.0
build_flags = -IInc
extra_scripts = add_nanolib.py
; OpenOCD's stm32f1x flash loader often HardFaults on GD32F130.
; Use stlink-org st-flash v1.7+ (bundled PlatformIO st-flash is too old).
upload_protocol = custom
upload_command = "$PROJECT_DIR/tools/stlink-1.7.0/stlink-1.7.0-x86_64-w64-mingw32/bin/st-flash.exe" write "$BUILD_DIR/firmware.bin" 0x08000000

; ---- Normal application firmware ----
[env:GD32F130C8T6]

; ---- Bench test: buzzer only (motor-safe) ----
[env:test_buzzer]
build_flags = ${env.build_flags} -D TEST_BUZZER

; ---- Bench test: hall sensor diagnostic (motor-safe) ----
[env:test_hall]
build_flags = ${env.build_flags} -D TEST_HALL

; ---- Bench test: motor drive (uses real firmware drive path) ----
; Wheel OFF THE GROUND. Reduced current limit + capped PWM for safe bring-up.
[env:test_motor]
build_flags = ${env.build_flags} -D TEST_MOTOR -D DC_CUR_LIMIT=3 -D MOTOR_TEST_PWM=150

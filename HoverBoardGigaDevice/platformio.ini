; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = Src
include_dir = Inc

[env]
; globally override framework-spl for all environments.
; uses self-uploaded package with GD32F support
platform_packages = 
    maxgerhardt/framework-spl@2.10302.0

[env:GD32F130C8T6]
platform = ststm32
board = gd32f130c8
debug_tool = stlink
framework = spl
build_flags = -IInc
extra_scripts = add_nanolib.py
; OpenOCD's stm32f1x flash loader often HardFaults on GD32F130.
; Use stlink-org st-flash v1.7+ (bundled PlatformIO st-flash is too old).
upload_protocol = custom
upload_command = "$PROJECT_DIR/tools/stlink-1.7.0/stlink-1.7.0-x86_64-w64-mingw32/bin/st-flash.exe" write "$BUILD_DIR/firmware.bin" 0x08000000
